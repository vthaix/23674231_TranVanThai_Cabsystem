services:

  # =========================
  # GATEWAY
  # =========================

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cab-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: development
    networks:
      - cab-internal
    restart: unless-stopped

  # =========================
  # MICROSERVICES
  # =========================

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: cab-identity-service
    environment:
      PORT: 3000
      SERVICE_NAME: identity-service
      NODE_ENV: development
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/identity_db
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      identity-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: cab-customer-service
    environment:
      PORT: 3001
      SERVICE_NAME: customer-service
      NODE_ENV: development
      DATABASE_URL: postgresql://customer:${CUSTOMER_DB_PASSWORD}@customer-db:5432/customer_db
    networks:
      - cab-internal
    depends_on:
      customer-db:
        condition: service_healthy
    restart: unless-stopped

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-driver-service
    environment:
      PORT: 3002
      SERVICE_NAME: driver-service
      NODE_ENV: development
      DATABASE_URL: postgresql://driver:${DRIVER_DB_PASSWORD}@driver-db:5432/driver_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      driver-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: cab-booking-service
    environment:
      PORT: 3003
      SERVICE_NAME: booking-service
      NODE_ENV: development
      DATABASE_URL: postgresql://booking:${BOOKING_DB_PASSWORD}@booking-db:5432/booking_db
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      booking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: cab-trip-service
    environment:
      PORT: 3004
      SERVICE_NAME: trip-service
      NODE_ENV: development
      DATABASE_URL: postgresql://trip:${TRIP_DB_PASSWORD}@trip-db:5432/trip_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      trip-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: cab-payment-service
    environment:
      PORT: 3005
      SERVICE_NAME: payment-service
      NODE_ENV: development
      DATABASE_URL: postgresql://payment:${PAYMENT_DB_PASSWORD}@payment-db:5432/payment_db
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: cab-notification-service
    environment:
      PORT: 3006
      SERVICE_NAME: notification-service
      MONGO_URL: mongodb://notification:${NOTIFICATION_DB_PASSWORD}@notification-db:27017/notification_db?authSource=admin
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # POSTGRESQL
  # =========================

  identity-db:
    image: postgres:16-alpine
    container_name: cab-identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U identity -d identity_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-db:
    image: postgres:16-alpine
    container_name: cab-customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U customer -d customer_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  driver-db:
    image: postgres:16-alpine
    container_name: cab-driver-db
    environment:
      POSTGRES_DB: driver_db
      POSTGRES_USER: driver
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD}
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U driver -d driver_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:16-alpine
    container_name: cab-booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booking -d booking_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  trip-db:
    image: postgres:16-alpine
    container_name: cab-trip-db
    environment:
      POSTGRES_DB: trip_db
      POSTGRES_USER: trip
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD}
    volumes:
      - trip-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trip -d trip_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    container_name: cab-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U payment -d payment_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # MONGODB
  # =========================

  notification-db:
    image: mongo:7
    container_name: cab-notification-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: notification
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - notification-db-data:/data/db
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # REDIS
  # =========================

  redis:
    image: redis:7-alpine
    container_name: cab-redis
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: cab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12

networks:
  cab-internal:
    driver: bridge

volumes:
  identity-db-data:
  customer-db-data:
  driver-db-data:
  booking-db-data:
  trip-db-data:
  payment-db-data:
  notification-db-data:
