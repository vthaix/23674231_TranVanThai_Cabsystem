services:

  # =========================
  # GATEWAY
  # =========================

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cab-gateway
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: development
    networks:
      - cab-internal
    restart: unless-stopped

  # =========================
  # MICROSERVICES
  # =========================

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: cab-identity-service
    environment:
      PORT: 3000
      SERVICE_NAME: identity-service
      NODE_ENV: development
      SEED_ON_START: ${SEED_ON_START:-false}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@host.docker.internal:5432/identity_db
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: cab-customer-service
    environment:
      PORT: 3001
      SERVICE_NAME: customer-service
      NODE_ENV: development
      SEED_ON_START: ${SEED_ON_START:-false}
      DATABASE_URL: postgresql://customer:${CUSTOMER_DB_PASSWORD}@host.docker.internal:5432/customer_db
    networks:
      - cab-internal
    restart: unless-stopped

  driver-service:
    build:
      context: .
      dockerfile: services/driver-service/Dockerfile
    container_name: cab-driver-service
    environment:
      PORT: 3002
      SERVICE_NAME: driver-service
      NODE_ENV: development
      SEED_ON_START: ${SEED_ON_START:-false}
      DATABASE_URL: postgresql://driver:${DRIVER_DB_PASSWORD}@host.docker.internal:5432/driver_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OFFER_TTL_SEC: ${OFFER_TTL_SEC:-1800}
    networks:
      - cab-internal
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: cab-booking-service
    environment:
      PORT: 3003
      SERVICE_NAME: booking-service
      NODE_ENV: development
      SEED_ON_START: ${SEED_ON_START:-false}
      DATABASE_URL: postgresql://booking:${BOOKING_DB_PASSWORD}@host.docker.internal:5432/booking_db
      KAFKA_BROKERS: kafka:9092
      OFFER_TTL_SEC: ${OFFER_TTL_SEC:-1800}
    networks:
      - cab-internal
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  trip-service:
    build:
      context: .
      dockerfile: services/trip-service/Dockerfile
    container_name: cab-trip-service
    environment:
      PORT: 3004
      SERVICE_NAME: trip-service
      NODE_ENV: development
      SEED_ON_START: ${SEED_ON_START:-false}
      DATABASE_URL: postgresql://trip:${TRIP_DB_PASSWORD}@host.docker.internal:5432/trip_db
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: cab-payment-service
    environment:
      PORT: 3005
      SERVICE_NAME: payment-service
      NODE_ENV: development
      DATABASE_URL: postgresql://payment:${PAYMENT_DB_PASSWORD}@host.docker.internal:5432/payment_db
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: cab-notification-service
    environment:
      PORT: 3006
      SERVICE_NAME: notification-service
      MONGO_URL: mongodb://notification:${NOTIFICATION_DB_PASSWORD}@notification-db:27017/notification_db?authSource=admin
      KAFKA_BROKERS: kafka:9092
    networks:
      - cab-internal
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  mock-payment-provider:
    build:
      context: .
      dockerfile: mocks/mock-payment-provider/Dockerfile
    container_name: cab-mock-payment-provider
    environment:
      PORT: 4001
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:-dev-callback-secret-key-32b!}
      MOCK_CALLBACK_DELAY_MS: ${MOCK_CALLBACK_DELAY_MS:-1000}
    networks:
      - cab-internal
    restart: unless-stopped

  mock-map-provider:
    build:
      context: .
      dockerfile: mocks/mock-map-provider/Dockerfile
    container_name: cab-mock-map-provider
    environment:
      PORT: 4002
    networks:
      - cab-internal
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    container_name: cab-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cab-internal
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic identity.events --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.events --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic driver.location --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic booking.events --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic trip.events --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.commands --replication-factor 1 --partitions 3
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification.dlq --replication-factor 1 --partitions 1
      echo 'Kafka topics created'
      "


  # =========================
  # MONGODB
  # =========================

  notification-db:
    image: mongo:7
    container_name: cab-notification-db
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: notification
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MONGO_INITDB_DATABASE: notification_db
    volumes:
      - notification-db-data:/data/db
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\"" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # REDIS
  # =========================

  redis:
    image: redis:7-alpine
    container_name: cab-redis
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================
  # KAFKA
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: cab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - cab-internal
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12

networks:
  cab-internal:
    driver: bridge

volumes:
  kafka-data:
  notification-db-data:
