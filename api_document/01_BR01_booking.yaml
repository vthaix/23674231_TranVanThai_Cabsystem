openapi: 3.0.3
info:
  title: CAB API - BR01 Booking Management
  version: 1.0.0
  description: 'API specification for FR01-FR06: pickup, destination, vehicle selection,
    booking creation, validation and cancellation.'
servers:
- url: http://localhost:8000/api/v1
tags:
- name: BR01
  description: Quản lý đặt xe
paths:
  /trips/estimate:
    post:
      summary: Estimate trip fare
      description: Preview/validate pickup, destination and vehicle type before creating
        a booking.
      tags:
      - BR01
      operationId: estimateTripFare
      responses:
        '200':
          description: Estimated fare
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimatedFare:
                    type: number
                  currency:
                    type: string
                    example: VND
                  distanceKm:
                    type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pickup
              - destination
              - vehicleType
              properties:
                pickup:
                  $ref: '#/components/schemas/Location'
                destination:
                  $ref: '#/components/schemas/Location'
                vehicleType:
                  type: string
                  enum:
                  - MOTORBIKE
                  - CAR_4
                  - CAR_7
      security:
      - bearerAuth: []
  /trips:
    post:
      summary: Create booking
      description: Create a trip request after required booking information has been
        validated.
      tags:
      - BR01
      operationId: createTrip
      responses:
        '201':
          description: Trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pickup
              - destination
              - vehicleType
              properties:
                pickup:
                  $ref: '#/components/schemas/Location'
                destination:
                  $ref: '#/components/schemas/Location'
                vehicleType:
                  type: string
                  enum:
                  - MOTORBIKE
                  - CAR_4
                  - CAR_7
      security:
      - bearerAuth: []
    get:
      summary: List customer trips
      description: List the authenticated customer's trips.
      tags:
      - BR01
      operationId: listTrips
      responses:
        '200':
          description: Trip list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
      security:
      - bearerAuth: []
  /trips/{tripId}/cancel:
    post:
      summary: Cancel booking
      description: Cancel a booking when its current status and business policy allow
        cancellation.
      tags:
      - BR01
      operationId: cancelTrip
      responses:
        '200':
          description: Cancelled trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        licensePlate:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Driver:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
        currentLatitude:
          type: number
          format: double
        currentLongitude:
          type: number
          format: double
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        status:
          type: string
          enum:
          - REQUESTED
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        fare:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        transactionId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
    Rating:
      type: object
      required:
      - rating
      properties:
        ratingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
