          action: Accept
        - step: 2
          action: Phat sinh loi
        - step: 3
          action: Kiem tra log
        expectedResult: Transaction xu ly dung va loi Assignment duoc log.
        assertions:
        - Transaction xu ly dung va loi Assignment duoc log.
        traceability:
          br:
          - BR05
          - BR06
          - BR07
          fr:
          - FR31
          - FR42
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
