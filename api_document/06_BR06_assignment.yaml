        scenario: '[Exception] Booking da co Trip active, co gang tao Trip thu hai (FR42,43)'
        priority: High
        testData:
        - Booking da gan voi 1 Trip active
        preconditions:
        - Booking da co 1 Trip dang active (chua COMPLETED/CANCELLED).
        steps:
        - step: 1
          action: He thong/Driver khac Accept lai Assignment cho cung Booking
        - step: 2
          action: He thong kiem tra Trip active hien co
        expectedResult: He thong tu choi tao Trip thu hai cho cung Booking; chi giu nguyen Trip active da co.
