name: BR06 - Assignment
version: '1.0'
source_of_truth:
  srs: srs.md
  test_cases: CAB_System_TestCases_Final_v2.xlsx
base_url: ${BASE_URL}
variables:
  token: ${TOKEN}
  admin_token: ${ADMIN_TOKEN}
  driver_token: ${DRIVER_TOKEN}
  customer_token: ${CUSTOMER_TOKEN}
  operations_token: ${OPERATIONS_TOKEN}
notes:
- SRS is the source of truth for requirements.
- Excel (CAB_System_TestCases_Final_v2.xlsx) is the source of truth for test cases.
- Concrete HTTP routes are not defined by SRS unless explicitly stated.
- Any inferred HTTP route or HTTP method must be marked as IMPLEMENTATION_MAPPING_REQUIRED.
- api.path below is cross-referenced against the real Express routes in cab_backend_nodejs/src/routes
  where available; when no matching route exists, api.note says NO_MATCHING_BACKEND_ROUTE.
- Assertions are kept in Vietnamese, split verbatim from the Excel 'Expected Result' column, to avoid
  any change of business meaning through translation.
tests:
- id: TC_FR31_43_POS
  uc: UC15
  scenario: '[Positive] Driver Accept va tao Trip thanh cong (FR31,43,42)'
  case: '[Positive] Driver Accept va tao Trip thanh cong'
  priority: High
  traceability:
    br:
    - BR05
    - BR06
    - BR07
    fr:
    - FR31
    - FR42
    - FR43
    brule:
    - BRULE07
    - BRULE11
    - BRULE28
    nfr:
    - NFR01
  api:
    method: POST
    path: /trips/{tripId}/accept
    mapping_status: IMPLEMENTATION_MAPPING_REQUIRED
    headers:
      Content-Type: application/json
      Authorization: Bearer ${DRIVER_TOKEN}
    body: {}
  preconditions:
  - Assignment SENT
  - Booking SEARCHING
  - Driver AVAILABLE.
  test_steps:
  - step: 1
    action: Driver xem request
  - step: 2
    action: Accept
  - step: 3
    action: He thong lock
  - step: 4
    action: Tao Trip
  assertions:
  - Assignment ACCEPTED
  - Booking ASSIGNED
  - Trip duoc tao status ASSIGNED
  - Driver BUSY.
  expected_result: Assignment ACCEPTED; Booking ASSIGNED; Trip duoc tao status ASSIGNED; Driver BUSY.
  test_data:
  - Assignment hop le
