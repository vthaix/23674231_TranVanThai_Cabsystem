        scenario: '[Exception] Loi giua transaction Accept (FR42)'
        priority: High
        testData:
        - DB transaction error
        preconditions:
        - Booking SEARCHING
        - Driver AVAILABLE.
        steps:
        - step: 1
          action: Bat loi khi tao Trip/cap nhat lien quan
        expectedResult: Transaction rollback; khong de Booking/Assignment/Driver o trang thai dang do.
        assertions:
        - Transaction rollback
        - khong de Booking/Assignment/Driver o trang thai dang do.
        traceability:
