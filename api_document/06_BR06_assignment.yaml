      - testCaseId: TC_FR31_RACE
        scenario: '[Boundary] Hai Driver Accept dong thoi (FR31)'
        priority: High
        testData:
        - Driver A va B Accept
        preconditions:
        - Hai Assignment cho cung Booking
        - ca hai Driver AVAILABLE.
        steps:
