          action: Driver xem request
        - step: 2
          action: Accept
        - step: 3
          action: He thong lock
        - step: 4
          action: Tao Trip
        expectedResult: Assignment ACCEPTED; Booking ASSIGNED; Trip duoc tao status ASSIGNED; Driver BUSY.
        assertions:
        - Assignment ACCEPTED
        - Booking ASSIGNED
        - Trip duoc tao status ASSIGNED
        - Driver BUSY.
        traceability:
