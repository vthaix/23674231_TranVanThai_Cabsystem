openapi: 3.0.3
info:
  title: CAB System API - BR11 - Notification
  version: '1.0'
  description: Swagger/OpenAPI specification for BR11 - Notification. Converted from the CAB System API test pack while preserving its test-case
    traceability. Business requirements and expected behavior remain source-derived.
servers:
- url: http://localhost:3000
  description: Local cab_backend_nodejs server. Change this URL to the actual API host/port before testing.
tags:
- name: BR11
  description: Business Requirement BR11
paths:
  /notifications:
    get:
      summary: Get /notifications
      description: API operation mapped from the existing CAB test-pack entries for GET /notifications. The SRS/test workbook defines business
        behavior and test evidence; exact HTTP contract details are not invented beyond the source test-pack mapping.
      operationId: get_notifications
      tags: &id001
      - BR11
      x-business-requirements: *id001
      x-functional-requirements:
      - FR70
      - FR71
      - FR72
      - FR73
      x-business-rules: []
      x-non-functional-requirements: []
      x-implementation-status: IMPLEMENTATION_MAPPING_REQUIRED
      x-test-cases:
      - testCaseId: TC_FR70_71_72_POS
        scenario: '[Positive] Tao gui va luu Notification cho su kien (FR70,71,72)'
        priority: High
        testData:
        - Booking/Driver/Trip/Payment event
        preconditions:
        - Xay ra su kien quan trong.
        steps:
        - step: 1
          action: Tao Notification
        - step: 2
          action: Gui Notification
        - step: 3
          action: Kiem tra DB
        expectedResult: Notification duoc tao, gui den recipient va luu lai de xem.
        assertions:
        - Notification duoc tao, gui den recipient va luu lai de xem.
        traceability:
          br:
          - BR11
          fr:
          - FR70
          - FR71
          - FR72
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      - testCaseId: TC_FR73_ISO
        scenario: '[Negative] Khong xem Notification cua recipient khac (FR73)'
        priority: High
        testData:
        - recipientId khac
        preconditions:
        - Notification cua user khac.
        steps:
        - step: 1
          action: Yeu cau truy cap
        expectedResult: He thong reject/khong tra du lieu khac recipient.
        assertions:
        - He thong reject/khong tra du lieu khac recipient.
        traceability:
          br:
          - BR11
          fr:
          - FR73
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      - testCaseId: TC_FR73_POS
        scenario: '[Positive] Xem Notification cua recipient (FR73,72)'
        priority: High
        testData:
        - Recipient hien tai
        preconditions:
        - User dang nhap
        - co Notification.
        steps:
        - step: 1
          action: Mo Notification
        expectedResult: He thong query dung recipient va hien thi Notification.
        assertions:
        - He thong query dung recipient va hien thi Notification.
        traceability:
          br:
          - BR11
          fr:
          - FR72
          - FR73
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      - testCaseId: TC_FR73_SORT
        scenario: '[Positive] Notification sap xep createdAt giam dan (FR73)'
        priority: High
        testData:
        - N1 createdAt moi
        - N2 cu
        preconditions:
        - Co nhieu Notification.
        steps:
        - step: 1
          action: Mo danh sach
        expectedResult: Notification duoc hien thi theo createdAt DESC.
        assertions:
        - Notification duoc hien thi theo createdAt DESC.
        traceability:
          br:
          - BR11
          fr:
          - FR73
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      responses:
        '200':
          description: Successful response / business outcome according to the source test cases.
        default:
          description: Other validation, authorization, business-rule, or server error according to backend implementation.
      security:
      - bearerAuth: []
  /notifications/{notificationId}/read:
    post:
      summary: Post /notifications/{notificationId}/read
      description: API operation mapped from the existing CAB test-pack entries for POST /notifications/{notificationId}/read. The SRS/test workbook
        defines business behavior and test evidence; exact HTTP contract details are not invented beyond the source test-pack mapping.
      operationId: post_notifications_notificationId_read
      tags: &id002
      - BR11
      x-business-requirements: *id002
      x-functional-requirements:
      - FR74
      x-business-rules: []
      x-non-functional-requirements: []
      x-implementation-status: IMPLEMENTATION_MAPPING_REQUIRED
      x-test-cases:
      - testCaseId: TC_FR74_POS
        scenario: '[Positive] Danh dau Notification da doc (FR74)'
        priority: High
        testData:
        - Notification unread
        preconditions:
        - Notification thuoc user
        - isRead=false.
        steps:
        - step: 1
          action: Mo Notification
        - step: 2
          action: Danh dau da doc
        expectedResult: isRead=true va readAt duoc luu.
        assertions:
        - isRead=true va readAt duoc luu.
        traceability:
          br:
          - BR11
          fr:
          - FR74
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      - testCaseId: TC_FR74_REPEAT
        scenario: '[Positive] Danh dau Notification da doc da doc (FR74)'
        priority: Medium
        testData:
        - Notification da doc
        preconditions:
        - Notification isRead=true.
        steps:
        - step: 1
          action: Gui request read
        expectedResult: Trang thai van nhat quan; khong tao du lieu doc moi bat hop ly.
        assertions:
        - Trang thai van nhat quan
        - khong tao du lieu doc moi bat hop ly.
        traceability:
          br:
          - BR11
          fr:
          - FR74
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: null
      responses:
        '200':
          description: Successful response / business outcome according to the source test cases.
        default:
          description: Other validation, authorization, business-rule, or server error according to backend implementation.
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 'Path parameter: notificationId.'
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
            example: {}
        description: Request payload is intentionally open because the source SRS/test workbook does not define a complete JSON request schema.
          Use the Test Case's testData and backend route contract to populate the payload.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use the JWT obtained from the login endpoint.
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
      description: Flexible JSON object. Exact fields are implementation-defined by the current backend/source test case.
