name: BR13 - Incident
version: '1.0'
source_of_truth:
  srs: srs.md
  test_cases: CAB_System_TestCases_Final_v2.xlsx
base_url: ${BASE_URL}
variables:
  token: ${TOKEN}
  admin_token: ${ADMIN_TOKEN}
  driver_token: ${DRIVER_TOKEN}
  customer_token: ${CUSTOMER_TOKEN}
  operations_token: ${OPERATIONS_TOKEN}
notes:
- SRS is the source of truth for requirements.
- Excel (CAB_System_TestCases_Final_v2.xlsx) is the source of truth for test cases.
- Concrete HTTP routes are not defined by SRS unless explicitly stated.
- Any inferred HTTP route or HTTP method must be marked as IMPLEMENTATION_MAPPING_REQUIRED.
- api.path below is cross-referenced against the real Express routes in cab_backend_nodejs/src/routes
  where available; when no matching route exists, api.note says NO_MATCHING_BACKEND_ROUTE.
- Assertions are kept in Vietnamese, split verbatim from the Excel 'Expected Result' column, to avoid
  any change of business meaning through translation.
tests:
- id: TC_FR81_82_POS
  uc: UC29
  scenario: '[Positive] Tao va xem Incident (FR81,82)'
  case: '[Positive] Tao va xem Incident'
  priority: High
  traceability:
    br:
    - BR13
    fr:
    - FR81
    - FR82
    brule: []
    nfr: []
  api:
    method: POST
    path: /incidents
    mapping_status: IMPLEMENTATION_MAPPING_REQUIRED
    headers:
      Content-Type: application/json
      Authorization: Bearer ${OPERATIONS_TOKEN}
    body: {}
    note: 'NO_MATCHING_BACKEND_ROUTE: Khong tim thay incident.routes.js trong backend hien tai.'
  preconditions:
  - Staff co permission.
  test_steps:
  - step: 1
    action: Tao Incident
  - step: 2
    action: Mo danh sach/chi tiet
  assertions:
  - Incident duoc CREATE va xem duoc
  - Incident co the khong gan Trip.
  expected_result: Incident duoc CREATE va xem duoc; Incident co the khong gan Trip.
  test_data:
  - Incident hop le
  - trip co the null
