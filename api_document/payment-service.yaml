openapi: 3.0.3
info:
  title: CAB Payment Service
  version: 1.0.0
  description: CAB System P1 API contract derived from srs.md and microservice_design.md. Public REST operations go through Gateway; internal communication uses gRPC (backend/shared/proto/cab.proto).
servers:
- url: http://localhost:8000/api/v1
  description: Gateway public API
tags:
- name: Public
  description: Client-facing API through Gateway
- name: Operational
  description: Liveness/readiness endpoints
paths:
  /payments/{id}:
    post:
      tags:
      - Public
      summary: Simulate payment completion for a completed trip
      description: Use the trip ID in the path. A trip participant or admin can confirm payment after the trip is COMPLETED. No request body is required. Replays are idempotent.
      operationId: completeTripPayment
      servers:
      - url: http://localhost:8000/api/v1
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Payment completed and trip payment status updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - Public
      summary: Get Payment
      operationId: getPayment
      servers:
      - url: http://localhost:8000/api/v1
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      additionalProperties: false
    HealthResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
        service:
          type: string
      additionalProperties: true
    ReadyResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      additionalProperties: true
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      required:
      - tripId
      - method
      properties:
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - ONLINE
          - BANK
          - CASH
        paymentMethodId:
          type: string
          format: uuid
      additionalProperties: false
    Payment:
      type: object
      required:
      - id
      - tripId
      - customerId
      - amount
      - currency
      - method
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        currency:
          type: string
          enum:
          - VND
        method:
          type: string
          enum:
          - ONLINE
        paymentMethodId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        failureCode:
          type: string
          nullable: true
        providerTransactionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    CreatePaymentResponse:
      type: object
      required:
      - id
      - tripId
      - amount
      - status
      - providerTransactionId
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
        providerTransactionId:
          type: string
      additionalProperties: false
    PaymentCallback:
      type: object
      description: Provider callback body. Documents require provider event identity, payment lookup by providerTransactionId/merchantRef,
        amount comparison and SUCCESS/FAILED result; exact provider field names beyond these concepts are not fully frozen.
      properties:
        providerEventId:
          type: string
        providerTransactionId:
          type: string
        merchantRef:
          type: string
        amount:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - SUCCESS
          - FAILED
        failureCode:
          type: string
      additionalProperties: true
      x-unresolved: Exact mock-provider callback envelope
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication/service credential failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, permission or ownership denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Business state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Idempotency-Key reused with a different payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Retry delay in seconds
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Required downstream service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: Optional client request id; Gateway preserves a valid value or generates one.
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Required for POST /bookings and POST /payments; retained for 24 hours.
    Signature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
      description: HMAC-SHA256 signature of the raw callback body.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT, HS256, TTL 15 minutes.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Short-lived internal JWT with iss/aud; caller must be allowed for the endpoint.
