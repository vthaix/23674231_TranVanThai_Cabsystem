  traceability:
    br:
    - BR01
    fr:
    - FR01
    brule: []
    nfr: []
  api:
    method: POST
    path: /register
    mapping_status: IMPLEMENTATION_MAPPING_REQUIRED
    headers:
      Content-Type: application/json
      Authorization: Bearer ${TOKEN}
    body: {}
  preconditions:
  - Da co Account dung email.
  test_steps:
  - step: 1
    action: Nhap email da ton tai
  - step: 2
    action: Gui dang ky
  assertions:
  - He thong reject, khong tao Account moi.
  expected_result: He thong reject, khong tao Account moi.
  test_data:
  - Email da ton tai
