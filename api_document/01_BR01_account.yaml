x-notes:
- SRS is the source of truth for requirements.
- Excel (CAB_System_TestCases_Final_v2.xlsx) is the source of truth for test cases.
- Concrete HTTP routes are not defined by SRS unless explicitly stated.
- Any inferred HTTP route or HTTP method must be marked as IMPLEMENTATION_MAPPING_REQUIRED.
- api.path below is cross-referenced against the real Express routes in cab_backend_nodejs/src/routes where available; when no matching route
  exists, api.note says NO_MATCHING_BACKEND_ROUTE.
- Assertions are kept in Vietnamese, split verbatim from the Excel 'Expected Result' column, to avoid any change of business meaning through translation.
