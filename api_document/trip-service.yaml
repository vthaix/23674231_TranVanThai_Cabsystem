openapi: 3.0.3
info:
  title: CAB Trip Service
  version: 1.0.0
  description: CAB System P1 API contract derived from srs.md and microservice_design.md. Public operations go through Gateway;
    /internal/** operations are service-to-service only.
servers:
- url: http://localhost:8000/api/v1
  description: Gateway public API
- url: http://localhost:3004
  description: trip-service direct/internal testing when reachable
tags:
- name: Public
  description: Client-facing API through Gateway
- name: Internal
  description: Service-to-service API; never expose through Gateway
- name: Operational
  description: Liveness/readiness endpoints
paths:
  /health:
    get:
      tags:
      - Operational
      summary: Liveness
      operationId: getCABTripServiceHealth
      servers:
      - url: http://localhost:3004
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Operational
      summary: Readiness
      operationId: getCABTripServiceReady
      servers:
      - url: http://localhost:3004
      responses:
        '200':
          description: Dependencies required by the service are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /trips/{id}:
    get:
      tags:
      - Public
      summary: Get Trip
      operationId: getTrip
      servers: &id001
      - url: http://localhost:8000/api/v1
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Trip with driver snapshot, fare, distance and payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{id}/location:
    get:
      tags:
      - Public
      summary: Get latest Driver location for Trip
      operationId: getTripLocation
      servers: *id001
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Latest location; location is null when unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{id}/status:
    patch:
      tags:
      - Public
      summary: Advance Trip state
      operationId: updateTripStatus
      servers: *id001
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStatusRequest'
      responses:
        '200':
          description: Trip state advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{id}/cancel:
    post:
      tags:
      - Public
      summary: Cancel Trip from ASSIGNED or ARRIVED
      operationId: cancelTrip
      servers: *id001
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTripRequest'
      responses:
        '200':
          description: Trip canceled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /trips/{id}/reviews:
    post:
      tags:
      - Public
      summary: Review a completed Trip
      operationId: reviewTrip
      servers: *id001
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /internal/trips:
    post:
      tags:
      - Internal
      summary: Create Trip from accepted Booking
      operationId: createInternalTrip
      servers: &id002
      - url: http://localhost:3004
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created or existing Trip returned idempotently
          content:
            application/json:
              schema:
                type: object
                required:
                - tripId
                properties:
                  tripId:
                    type: string
                    format: uuid
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/trips/{id}:
    get:
      tags:
      - Internal
      summary: Get Trip payment view
      operationId: getInternalTrip
      servers: *id002
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Fields required by payment-service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTripPaymentView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/trips/{id}/payment-status:
    post:
      tags:
      - Internal
      summary: Mark Trip PAID
      operationId: markTripPaid
      servers: *id002
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStatusRequest'
      responses:
        '200':
          description: paymentStatus is PAID; operation is idempotent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      additionalProperties: false
    HealthResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
        service:
          type: string
      additionalProperties: true
    ReadyResponse:
      type: object
      required:
      - status
      - service
      properties:
        status:
          type: string
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      additionalProperties: true
    Pagination:
      type: object
      required:
      - page
      - limit
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      additionalProperties: false
    DriverSnapshot:
      type: object
      required:
      - fullName
      - ratingAvg
      - vehicle
      properties:
        fullName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        ratingAvg:
          type: number
        vehicle:
          type: object
          required:
          - vehicleType
          - plateNumber
          - brand
          - model
          - color
          properties:
            vehicleType:
              type: string
              enum:
              - BIKE
              - SEDAN
              - SUV
            plateNumber:
              type: string
            brand:
              type: string
            model:
              type: string
            color:
              type: string
          additionalProperties: false
      additionalProperties: false
    Trip:
      type: object
      required:
      - id
      - bookingId
      - customerId
      - driverId
      - vehicleId
      - driver
      - status
      - fare
      - distanceKm
      - paymentStatus
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        driver:
          $ref: '#/components/schemas/DriverSnapshot'
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
        fare:
          type: integer
          format: int64
        distanceKm:
          type: number
        paymentStatus:
          type: string
          enum:
          - UNPAID
          - PAID
        assignedAt:
          type: string
          format: date-time
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        canceledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true
      additionalProperties: false
    TripStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
      additionalProperties: false
    CancelTripRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
      additionalProperties: false
    TripLocation:
      type: object
      required:
      - location
      properties:
        location:
          nullable: true
          allOf:
          - type: object
            required:
            - lat
            - lng
            - updatedAt
            properties:
              lat:
                type: number
              lng:
                type: number
              heading:
                type: integer
                nullable: true
              updatedAt:
                type: string
                format: date-time
            additionalProperties: false
      additionalProperties: false
    ReviewRequest:
      type: object
      required:
      - stars
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
      additionalProperties: false
    Review:
      type: object
      required:
      - id
      - tripId
      - customerId
      - driverId
      - stars
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      additionalProperties: false
    CreateTripRequest:
      type: object
      description: Internal CreateTrip is idempotent by bookingId. Documents require Booking data sufficient to create the
        Trip, but do not freeze the full request envelope.
      required:
      - bookingId
      properties:
        bookingId:
          type: string
          format: uuid
      additionalProperties: true
      x-unresolved: Full internal CreateTrip request envelope
    InternalTripPaymentView:
      type: object
      required:
      - status
      - fare
      - customerId
      - paymentStatus
      properties:
        status:
          type: string
          enum:
          - ASSIGNED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELED
        fare:
          type: integer
          format: int64
        customerId:
          type: string
          format: uuid
        paymentStatus:
          type: string
          enum:
          - UNPAID
          - PAID
      additionalProperties: false
    PaymentStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PAID
      additionalProperties: false
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication/service credential failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, permission or ownership denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Business state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Idempotency-Key reused with a different payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Retry delay in seconds
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Required downstream service is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: Optional client request id; Gateway preserves a valid value or generates one.
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
      description: Required for POST /bookings and POST /payments; retained for 24 hours.
    Signature:
      in: header
      name: X-Signature
      required: true
      schema:
        type: string
      description: HMAC-SHA256 signature of the raw callback body.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User JWT, HS256, TTL 15 minutes.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Short-lived internal JWT with iss/aud; caller must be allowed for the endpoint.
