openapi: 3.0.3
info:
  title: CAB API - BR03 Trip Management
  version: 1.0.0
  description: 'API specification for FR17-FR23: driver acceptance/rejection, trip
    state updates and cancellation.'
servers:
- url: http://localhost:8000/api/v1
tags:
- name: BR03
  description: Quản lý chuyến xe
paths:
  /trips/{tripId}/accept:
    post:
      summary: Accept trip
      description: Driver accepts an assigned trip.
      tags:
      - BR03
      operationId: acceptTrip
      responses:
        '200':
          description: Accepted trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      security:
      - bearerAuth: []
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /trips/{tripId}/reject:
    post:
      summary: Reject trip
      description: Driver rejects a trip and the dispatch process may continue.
      tags:
      - BR03
      operationId: rejectTrip
      responses:
        '200':
          description: Rejected trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /trips/{tripId}/status:
    patch:
      summary: Update trip status
      description: Update trip through valid states such as DRIVER_ARRIVED, PASSENGER_PICKED_UP,
        IN_PROGRESS and COMPLETED.
      tags:
      - BR03
      operationId: updateTripStatus
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - DRIVER_ARRIVED
                  - PASSENGER_PICKED_UP
                  - IN_PROGRESS
                  - COMPLETED
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /trips/{tripId}/cancel-by-driver:
    post:
      summary: Cancel trip by driver
      description: Cancel a trip when permitted by policy and notify the customer.
      tags:
      - BR03
      operationId: cancelTripByDriver
      responses:
        '200':
          description: Cancelled trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /drivers/me/status:
    patch:
      summary: Update driver availability
      description: Set driver availability so the driver can or cannot receive trips.
      tags:
      - BR03
      operationId: updateDriverStatus
      responses:
        '200':
          description: Driver updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - AVAILABLE
                  - BUSY
                  - OFFLINE
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        licensePlate:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Driver:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
        currentLatitude:
          type: number
          format: double
        currentLongitude:
          type: number
          format: double
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        status:
          type: string
          enum:
          - REQUESTED
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        fare:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        transactionId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
    Rating:
      type: object
      required:
      - rating
      properties:
        ratingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
