    note: 'NO_MATCHING_BACKEND_ROUTE: Khong tim thay permission.routes.js trong backend hien tai.'
  preconditions:
  - User khong co permission.
  test_steps:
  - step: 1
    action: Gui request admin
  assertions:
  - Backend reject/403, khong tin permission tu frontend.
  expected_result: Backend reject/403, khong tin permission tu frontend.
  test_data:
  - Permission thieu
