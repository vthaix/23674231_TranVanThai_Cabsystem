        - toi da mot Payment SUCCESS cho Trip.
        traceability:
          br:
          - BR10
          fr:
          - FR67
          brule:
          - BRULE17
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: Kem POST /trips/{tripId}/payments/online va POST /payments/{paymentId}/callback.
      - testCaseId: TC_FR69_SECURITY
