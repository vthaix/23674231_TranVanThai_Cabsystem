        priority: High
        testData:
        - Card number/CVV/PIN
        preconditions:
        - Online Payment.
        steps:
        - step: 1
          action: Thuc hien payment
        - step: 2
          action: Kiem tra DB/log
        expectedResult: He thong khong luu Card Number/CVV/PIN; khong ghi vao log.
        assertions:
        - He thong khong luu Card Number/CVV/PIN
        - khong ghi vao log.
        traceability:
