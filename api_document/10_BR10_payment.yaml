        preconditions:
        - Trip COMPLETED
        - online Payment.
        steps:
        - step: 1
          action: Gui payment
        - step: 2
          action: Provider loi
        expectedResult: Trip van giu trang thai COMPLETED; Payment duoc danh dau phu hop.
        assertions:
        - Trip van giu trang thai COMPLETED
        - Payment duoc danh dau phu hop.
        traceability:
          br:
          - BR10
          fr:
          - FR63
          - FR64
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: Kem POST /trips/{tripId}/payments/online va POST /payments/{paymentId}/callback.
      - testCaseId: TC_FR60_PRE
        scenario: '[Negative] Thanh toan khi Trip chua COMPLETED (FR60)'
        priority: High
        testData:
        - Trip chua COMPLETED
        preconditions:
        - Trip IN_PROGRESS/khac COMPLETED.
        steps:
        - step: 1
          action: Gui request Payment
        expectedResult: He thong reject.
        assertions:
