          nfr:
          - NFR03
          - NFR04
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: Kem POST /trips/{tripId}/payments/online va POST /payments/{paymentId}/callback.
      - testCaseId: TC_LOG_PAYMENT_FAIL
        scenario: '[Exception] Ghi log loi Payment Provider (FR64,66)'
        priority: High
        testData:
        - Provider error
        preconditions:
        - Online payment
        - Provider failure/timeout.
        steps:
        - step: 1
          action: Gui payment
        - step: 2
          action: Provider loi
        - step: 3
          action: Kiem tra log
        expectedResult: Payment error duoc log; log khong chua du lieu the nhay cam.
        assertions:
        - Payment error duoc log
        - log khong chua du lieu the nhay cam.
        traceability:
          br:
          - BR10
          fr:
          - FR64
          - FR66
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: Kem POST /trips/{tripId}/payments/online va POST /payments/{paymentId}/callback.
