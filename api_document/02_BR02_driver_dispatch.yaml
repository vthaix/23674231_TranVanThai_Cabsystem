openapi: 3.0.3
info:
  title: CAB API - BR02 Driver Dispatch
  version: 1.0.0
  description: 'API specification for FR07-FR16: location-based driver search, filtering,
    prioritization, dispatch and retry.'
servers:
- url: http://localhost:8000/api/v1
tags:
- name: BR02
  description: Phân công tài xế
paths:
  /dispatch/drivers/search:
    get:
      summary: Find suitable drivers
      description: Find available drivers, filter by vehicle type and distance, and
        rank nearest suitable drivers first.
      tags:
      - BR02
      operationId: searchDrivers
      responses:
        '200':
          description: Matching drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
      parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          format: double
      - name: vehicleType
        in: query
        required: true
        schema:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
      - name: radiusKm
        in: query
        required: false
        schema:
          type: number
          minimum: 0
      security:
      - bearerAuth: []
  /dispatch/trips/{tripId}/assign:
    post:
      summary: Assign driver
      description: Assign the first suitable driver that accepts the trip.
      tags:
      - BR02
      operationId: assignDriver
      responses:
        '200':
          description: Assigned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - driverId
              properties:
                driverId:
                  type: string
                  format: uuid
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /dispatch/trips/{tripId}/retry:
    post:
      summary: Retry driver dispatch
      description: Continue driver search after rejection, timeout or driver loss
        of connection.
      tags:
      - BR02
      operationId: retryDriverDispatch
      responses:
        '200':
          description: Dispatch restarted
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: string
                    format: uuid
                  status:
                    type: string
                  message:
                    type: string
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        licensePlate:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Driver:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
        currentLatitude:
          type: number
          format: double
        currentLongitude:
          type: number
          format: double
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        status:
          type: string
          enum:
          - REQUESTED
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        fare:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        transactionId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
    Rating:
      type: object
      required:
      - rating
      properties:
        ratingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
