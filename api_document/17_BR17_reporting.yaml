name: BR17 - Reporting
version: '1.0'
source_of_truth:
  srs: srs.md
  test_cases: CAB_System_TestCases_Final_v2.xlsx
base_url: ${BASE_URL}
variables:
  token: ${TOKEN}
  admin_token: ${ADMIN_TOKEN}
  driver_token: ${DRIVER_TOKEN}
  customer_token: ${CUSTOMER_TOKEN}
  operations_token: ${OPERATIONS_TOKEN}
  management_token: ${MANAGEMENT_TOKEN}
notes:
- SRS is the source of truth for requirements.
- Excel (CAB_System_TestCases_Final_v2.xlsx) is the source of truth for test cases.
- Concrete HTTP routes are not defined by SRS unless explicitly stated.
- Any inferred HTTP route or HTTP method must be marked as IMPLEMENTATION_MAPPING_REQUIRED.
- api.path below is cross-referenced against the real Express routes in cab_backend_nodejs/src/routes
  where available; when no matching route exists, api.note says NO_MATCHING_BACKEND_ROUTE.
- Assertions are kept in Vietnamese, split verbatim from the Excel 'Expected Result' column, to avoid
  any change of business meaning through translation.
tests:
- id: TC_FR106_107_108_109_110_POS
  uc: UC38
  scenario: '[Positive] Xem Dashboard voi cac chi so tong hop (FR106,107,108,109,110)'
  case: '[Positive] Xem Dashboard voi cac chi so tong hop'
  priority: High
  traceability:
    br:
    - BR17
    fr:
    - FR106
    - FR107
    - FR108
    - FR109
    - FR110
    brule: []
    nfr: []
  api:
    method: GET
    path: /reports/dashboard
    mapping_status: IMPLEMENTATION_MAPPING_REQUIRED
    headers:
      Content-Type: application/json
      Authorization: Bearer ${MANAGEMENT_TOKEN}
    body: {}
    note: 'NO_MATCHING_BACKEND_ROUTE: Khong tim thay report/dashboard route trong backend hien tai.'
  preconditions:
  - Management User co quyen
  - co domain data.
  test_steps:
  - step: 1
    action: Mo Dashboard
  assertions:
  - Hien thi Total Trips, Completed, Cancelled, Revenue, Completion Rate, Cancellation Rate, Driver Metrics.
  expected_result: Hien thi Total Trips, Completed, Cancelled, Revenue, Completion Rate, Cancellation
    Rate, Driver Metrics.
  test_data:
  - Trip, Payment, Driver, Rating data
