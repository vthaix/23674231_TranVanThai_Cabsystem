name: BR07 - Trip
version: '1.0'
source_of_truth:
  srs: srs.md
  test_cases: CAB_System_TestCases_Final_v2.xlsx
base_url: ${BASE_URL}
variables:
  token: ${TOKEN}
  admin_token: ${ADMIN_TOKEN}
  driver_token: ${DRIVER_TOKEN}
  customer_token: ${CUSTOMER_TOKEN}
  operations_token: ${OPERATIONS_TOKEN}
notes:
- SRS is the source of truth for requirements.
- Excel (CAB_System_TestCases_Final_v2.xlsx) is the source of truth for test cases.
- Concrete HTTP routes are not defined by SRS unless explicitly stated.
- Any inferred HTTP route or HTTP method must be marked as IMPLEMENTATION_MAPPING_REQUIRED.
- api.path below is cross-referenced against the real Express routes in cab_backend_nodejs/src/routes
  where available; when no matching route exists, api.note says NO_MATCHING_BACKEND_ROUTE.
- Assertions are kept in Vietnamese, split verbatim from the Excel 'Expected Result' column, to avoid
  any change of business meaning through translation.
tests:
- id: TC_BRULE30_NOTIFY_FAIL
  uc: UC21
  scenario: '[Exception] Notification Provider loi khi hoan thanh Trip (FR48)'
  case: '[Exception] Notification Provider loi khi hoan thanh Trip'
  priority: High
  traceability:
    br:
    - BR07
    fr:
    - FR48
    brule:
    - BRULE30
    nfr: []
  api:
    method: PATCH
    path: /trips/{tripId}/status
    mapping_status: IMPLEMENTATION_MAPPING_REQUIRED
    headers:
      Content-Type: application/json
      Authorization: Bearer ${TOKEN}
    body: {}
    note: Dung chung route voi UC18, target status = COMPLETED.
  preconditions:
  - Trip IN_PROGRESS
  - Notification Provider dang loi.
  test_steps:
  - step: 1
    action: Driver Complete
  - step: 2
    action: Notification Provider loi
  - step: 3
    action: Kiem tra Trip
  assertions:
  - Trip van chuyen COMPLETED
  - transaction nghiep vu chinh khong rollback va loi Notification duoc xu ly/log theo chinh sach (BRULE30).
  expected_result: Trip van chuyen COMPLETED; transaction nghiep vu chinh khong rollback va loi Notification
    duoc xu ly/log theo chinh sach (BRULE30).
  test_data:
  - Notification provider failure
