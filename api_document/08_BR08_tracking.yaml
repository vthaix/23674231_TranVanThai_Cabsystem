      - testCaseId: TC_FR54_NOGPSHISTORY
        scenario: '[Negative] Khong tao lich su GPS chi tiet (FR52,53,54)'
        priority: High
        testData:
        - Nhieu lan update
        preconditions:
        - Driver cap nhat location nhieu lan.
        steps:
        - step: 1
          action: Cap nhat location nhieu lan
        - step: 2
          action: Kiem tra du lieu
        expectedResult: Chi luu vi tri hien tai va locationUpdatedAt; khong tao GPS history.
        assertions:
        - Chi luu vi tri hien tai va locationUpdatedAt
        - khong tao GPS history.
        traceability:
          br:
          - BR08
          fr:
          - FR52
          - FR53
          - FR54
          brule: []
          nfr: []
