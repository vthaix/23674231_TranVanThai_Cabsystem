        preconditions:
        - Driver dang nhap.
        steps:
        - step: 1
          action: Gui latitude/longitude
        - step: 2
          action: Luu
        expectedResult: Driver.currentLatitude/currentLongitude va locationUpdatedAt duoc UPDATE.
        assertions:
        - Driver.currentLatitude/currentLongitude va locationUpdatedAt duoc UPDATE.
        traceability:
          br:
          - BR08
          fr:
          - FR52
          - FR53
          - FR54
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
        mappingNote: 'NO_MATCHING_BACKEND_ROUTE: tracking.routes.js chi co GET, chua thay POST/PATCH cap nhat vi tri.'
      - testCaseId: TC_FR52_INVALID
        scenario: '[Negative] Cap nhat toa do ngoai range (FR52,53)'
        priority: High
        testData:
        - Latitude/longitude ngoai range
        preconditions:
        - Driver dang nhap.
        steps:
        - step: 1
          action: Gui toa do khong hop le
        expectedResult: Backend reject; khong cap nhat location.
        assertions:
        - Backend reject
        - khong cap nhat location.
        traceability:
          br:
