          action: Update location
        - step: 2
          action: Kiem tra Driver
        expectedResult: locationUpdatedAt duoc luu.
        assertions:
        - locationUpdatedAt duoc luu.
        traceability:
          br:
          - BR08
          fr:
          - FR54
          brule: []
          nfr: []
        mappingStatus: IMPLEMENTATION_MAPPING_REQUIRED
