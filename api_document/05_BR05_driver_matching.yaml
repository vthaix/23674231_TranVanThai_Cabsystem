        preconditions:
        - Driver duoc de xuat nhung dang co Trip khac.
        steps:
        - step: 1
          action: He thong matching/accept
        - step: 2
          action: Kiem tra Driver
        expectedResult: He thong khong cho Assignment/Accept cho Driver nay va tiep tuc xu ly Driver phu hop khac.
        assertions:
