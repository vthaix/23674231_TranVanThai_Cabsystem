          action: Thuc hien matching cho Booking SEARCHING
        - step: 2
          action: Kiem tra danh sach Driver duoc xem xet
        expectedResult: Driver X khong duoc dua vao trang thai AVAILABLE va khong xuat hien trong danh sach matching.
