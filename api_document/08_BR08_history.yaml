openapi: 3.0.3
info:
  title: CAB API - BR08 History
  version: 1.0.0
  description: 'API specification for FR45-FR48: trip history, payment history and
    operational transaction lookup.'
servers:
- url: http://localhost:8000/api/v1
tags:
- name: BR08
  description: Lưu trữ lịch sử
paths:
  /customers/me/trip-history:
    get:
      summary: Get trip history
      description: Customer retrieves historical trips belonging to the authenticated
        account.
      tags:
      - BR08
      operationId: getTripHistory
      responses:
        '200':
          description: Trip history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security:
      - bearerAuth: []
  /operations/payments:
    get:
      summary: Search payment transactions
      description: Operations staff can query stored payment transactions.
      tags:
      - BR08
      operationId: searchPayments
      responses:
        '200':
          description: Payment transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
      parameters:
      - name: tripId
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      security:
      - bearerAuth: []
  /trips/{tripId}/history:
    get:
      summary: Get stored trip record
      description: Retrieve the persisted trip record.
      tags:
      - BR08
      operationId: getStoredTrip
      responses:
        '200':
          description: Trip record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
  /trips/{tripId}/payment:
    get:
      summary: Get stored payment record
      description: Retrieve the persisted payment information for a trip.
      tags:
      - BR08
      operationId: getStoredPayment
      responses:
        '200':
          description: Payment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
      parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
    Location:
      type: object
      required:
      - latitude
      - longitude
      properties:
        address:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        licensePlate:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Driver:
      type: object
      properties:
        driverId:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - AVAILABLE
          - BUSY
          - OFFLINE
        currentLatitude:
          type: number
          format: double
        currentLongitude:
          type: number
          format: double
        vehicle:
          $ref: '#/components/schemas/Vehicle'
    Trip:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        vehicleId:
          type: string
          format: uuid
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum:
          - MOTORBIKE
          - CAR_4
          - CAR_7
        status:
          type: string
          enum:
          - REQUESTED
          - SEARCHING_DRIVER
          - DRIVER_ASSIGNED
          - DRIVER_ARRIVED
          - PASSENGER_PICKED_UP
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
        fare:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
    Payment:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - CASH
          - ONLINE
        amount:
          type: number
          format: double
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
        transactionId:
          type: string
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
    Rating:
      type: object
      required:
      - rating
      properties:
        ratingId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
